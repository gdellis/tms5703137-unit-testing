name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [host, host-clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby gcc clang

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    name: Coverage (gcc + gcovr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby gcc
          pip install gcovr

      - name: Configure
        run: cmake --preset host-coverage

      - name: Build
        run: cmake --build --preset host-coverage

      - name: Test and report
        run: cmake --build --preset host-coverage-report

      - name: Summary
        if: always()
        run: |
          echo '### Line coverage of src/' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build/host-coverage/coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/host-coverage/coverage/

  host-m32:
    name: Host unit tests (gcc -m32, ILP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby gcc gcc-multilib

      - name: Configure
        run: cmake --preset host-m32

      - name: Build
        run: cmake --build --preset host-m32

      - name: Test
        run: ctest --preset host-m32

  target-dryrun:
    name: Target build dry run (no TI compiler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby

      # Exercises cmake/toolchain-ti-armcl.cmake, target/CMakeLists.txt, the link
      # lines and the CTest emulator wiring with stand-in armcl/armar scripts. It
      # compiles nothing; a real run needs the TI toolchain and a board (docs/03).
      - name: Configure
        run: cmake --preset target-dryrun

      - name: Build
        run: cmake --build --preset target-dryrun -- -v

      - name: Test wiring
        run: ctest --preset target-dryrun
