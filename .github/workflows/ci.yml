name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [host, host-clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby gcc clang

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    name: Coverage (gcc + gcovr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby gcc
          pip install gcovr

      - name: Configure
        run: cmake --preset host-coverage

      - name: Build
        run: cmake --build --preset host-coverage

      - name: Test and report
        run: cmake --build --preset host-coverage-report

      - name: Summary
        if: always()
        run: |
          echo '### Line coverage of src/' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build/host-coverage/coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/host-coverage/coverage/

  host-m32:
    name: Host unit tests (gcc -m32, ILP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby gcc gcc-multilib

      - name: Configure
        run: cmake --preset host-m32

      - name: Build
        run: cmake --build --preset host-m32

      - name: Test
        run: ctest --preset host-m32

  target-build:
    name: Target build (TI armcl 20.2.7.LTS, stub board support)
    runs-on: ubuntu-latest
    env:
      TI_CGT_ARM_VERSION: 20.2.7.LTS
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby

      # ~100 MB installer; cached across runs by version.
      - name: Cache TI ARM CGT
        uses: actions/cache@v4
        with:
          path: ~/ti/ti-cgt-arm_${{ env.TI_CGT_ARM_VERSION }}
          key: ti-cgt-arm-${{ env.TI_CGT_ARM_VERSION }}-linux-x64

      # Downloads + installs unattended on a cache miss, no-op on a hit; either way it
      # exports TI_CGT_ARM_ROOT for the following steps.
      - name: Install TI ARM CGT
        run: tools/ci/install-ti-cgt.sh ~/ti/ti-cgt-arm_${{ env.TI_CGT_ARM_VERSION }}

      # Real armcl, stub HALCoGen (tools/halcogen-stub): every test binary is compiled
      # and linked for the Cortex-R4F. Nothing runs; the .out files must not be flashed.
      - name: Configure
        run: cmake --preset target-ci

      - name: Build
        run: cmake --build --preset target-ci -- -v

      - name: Upload test images and map files
        uses: actions/upload-artifact@v4
        with:
          name: tms570-test-images
          path: |
            build/target-ci/test/*.out
            build/target-ci/*.map

  target-dryrun:
    name: Target build dry run (no TI compiler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ruby

      # Exercises cmake/toolchain-ti-armcl.cmake, target/CMakeLists.txt, the link
      # lines and the CTest emulator wiring with stand-in armcl/armar scripts. It
      # compiles nothing; a real run needs the TI toolchain and a board (docs/03).
      - name: Configure
        run: cmake --preset target-dryrun

      - name: Build
        run: cmake --build --preset target-dryrun -- -v

      - name: Test wiring
        run: ctest --preset target-dryrun
